name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# Deploy the built site to GitHub Pages via the Pages artifact flow.
# Requires Settings > Pages > Source set to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; in-progress runs finish
# (cancel-in-progress defaults to false, so the string form suffices).
concurrency: pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # --clean skips the build cache (not recommended on CI yet); --strict
      # fails on broken links or nav entries.
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
