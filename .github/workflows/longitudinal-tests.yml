name: longitudinal-tests

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: 'DELTA-SVD image with an exact SHA-256 digest (production or staging)'
        required: true
        type: string

permissions:
  contents: read

env:
  DATASET_URL: https://zenodo.org/records/23723917/files/delta-svd-longitudinal-test-v2.zip
  DATASET_SHA256: 88d7aab257c5f20d3a6acdfcd837a5d6d4994b825ff4f47b3225341b6ebf4e8f

jobs:
  longitudinal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        subject: [sub-test01, sub-test02]
    env:
      IMAGE: ${{ inputs.image }}
      SUBJECT: ${{ matrix.subject }}
      DATASET: ${{ github.workspace }}/dataset/delta-svd-longitudinal-test-v2
      RESULTS: ${{ github.workspace }}/results
    steps:
      - name: Require an exact DELTA-SVD image digest
        shell: bash
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/isdneuroimaging/delta-svd(-staging)?@sha256:[0-9a-f]{64}$ ]] || { echo '::error::expected a DELTA-SVD image with a SHA-256 digest'; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download and verify the reference dataset
        shell: bash
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            "$DATASET_URL" \
            --output "$RUNNER_TEMP/dataset.zip"
          echo "$DATASET_SHA256  $RUNNER_TEMP/dataset.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dataset.zip" -d "$GITHUB_WORKSPACE/dataset"
          python -m pip install -r tests/requirements-longitudinal.txt

      - name: Process and compare with the approved reference
        id: compare
        shell: bash
        env:
          PYTHON: python
        run: |
          bash tests/run-longitudinal.sh "$DATASET" "$IMAGE" "$RESULTS" "$SUBJECT" \
            2>&1 | tee validation.log

      - name: Save results and QC, including on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longitudinal-${{ matrix.subject }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            validation.log
            results/${{ matrix.subject }}/*.csv
            results/${{ matrix.subject }}/*.json
            results/${{ matrix.subject }}/*.html
            results/${{ matrix.subject }}/*.log
            results/${{ matrix.subject }}/comparison.txt

      - name: Longitudinal result summary
        if: always()
        shell: bash
        env:
          COMPARISON_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          {
            echo "### Longitudinal validation: $SUBJECT"
            if [[ "$COMPARISON_OUTCOME" == success ]]; then
              echo "PASS — all metric values and skeleton voxel counts match the approved reference exactly."
            elif [[ "$COMPARISON_OUTCOME" == failure ]]; then
              echo "FAIL — processing or reference comparison failed. Review the job logs and longitudinal artifacts for details."
            else
              echo "INCOMPLETE — longitudinal validation did not finish. Review the job logs for details."
            fi
            echo
            echo "HTML QC reports are available in the longitudinal-$SUBJECT-${{ github.run_attempt }} artifact for visual review."
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    # Standalone comparisons may target older images without a run manifest.
    # Release builds must produce complete evidence before they can be attested.
    if: github.event_name == 'push'
    needs: longitudinal
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: longitudinal-*-${{ github.run_attempt }}
          merge-multiple: true
          path: validation

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Package release test evidence
        run: python3 tools/package_test_evidence.py validation/results evidence

      - uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_attempt }}
          path: evidence/delta-svd_*_test-evidence.zip
          if-no-files-found: error
          retention-days: 7
