name: release-build

# Builds, stages and regression-tests the release image for manual review; see
# CONTRIBUTING.md "Releasing". release-promote.yml publishes it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION file (v${VERSION})"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA-only tag: never version-shaped, so it can't be mistaken for a release.
      # --provenance/--sbom off: their default sibling-manifest attestation would turn this
      # into an OCI index; actions/attest-build-provenance below is the provenance used here.
      - name: Build and push staging image
        run: |
          container/build.sh "ghcr.io/isdneuroimaging/delta-svd-staging:${GITHUB_SHA}" \
            --provenance=false \
            --sbom=false \
            --push \
            --metadata-file metadata.json

      - id: digest
        run: echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Staged image summary
        run: |
          {
            echo "### Staged image"
            echo '```'
            echo "ghcr.io/isdneuroimaging/delta-svd-staging@${{ steps.digest.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the staged image
        env:
          DELTA_SVD_TEST_IMAGE: ghcr.io/isdneuroimaging/delta-svd-staging@${{ steps.digest.outputs.digest }}
        run: tests/run-in-locked-env.sh

  longitudinal:
    needs: build
    uses: ./.github/workflows/longitudinal-tests.yml
    with:
      image: ghcr.io/isdneuroimaging/delta-svd-staging@${{ needs.build.outputs.digest }}

  validated:
    needs: [build, longitudinal]
    runs-on: ubuntu-24.04
    steps:
      # Promotion requires this attestation, so issue it only after the
      # longitudinal regression tests and staged-image unit tests have passed,
      # and the reusable longitudinal workflow has uploaded complete test evidence.
      - name: Require this attempt's test evidence
        uses: actions/download-artifact@v8
        with:
          name: test-evidence-${{ github.run_attempt }}
          path: evidence

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/isdneuroimaging/delta-svd-staging
          subject-digest: ${{ needs.build.outputs.digest }}

      - name: Job summary
        run: |
          {
            echo "Staged-image unit tests passed; all longitudinal regression subjects match the approved reference exactly."
            echo "Review the longitudinal artifacts and QC, then run release-promote.yml with this digest."
          } >> "$GITHUB_STEP_SUMMARY"
