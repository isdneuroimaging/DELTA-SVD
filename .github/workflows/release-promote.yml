name: release-promote

# Publishes a digest staged by release-build.yml, once a human has validated
# it; see CONTRIBUTING.md "Releasing". Copies the manifest, never rebuilds,
# so the published image is byte-for-byte the artefact that was validated.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Validated digest from delta-svd-staging (sha256:...)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SRC: ghcr.io/isdneuroimaging/delta-svd-staging@${{ github.event.inputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version comes from the image's own labels, not a checkout: this re-check is
      # what stops a malformed or unvalidated digest reaching the production tag.
      - name: Re-verify labels on the staged digest
        id: labels
        run: |
          LABELS="$(docker buildx imagetools inspect "$SRC" --format '{{json .Image.Config.Labels}}')"
          VERSION="$(echo "$LABELS" | jq -r '."org.opencontainers.image.version" // empty')"
          REVISION="$(echo "$LABELS" | jq -r '."org.opencontainers.image.revision" // empty')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad or missing version label: '$VERSION'"; exit 1; }
          [[ -n "$REVISION" && "$REVISION" != "unknown" && "$REVISION" != *-dirty ]] || { echo "::error::bad, unknown, or dirty revision label: '$REVISION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Copy manifest to the production package
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/isdneuroimaging/delta-svd:${{ steps.labels.outputs.version }}" \
            "$SRC"

      # --verify-tag requires the v<VERSION> tag on the remote; it does, since
      # pushing it is what triggered the build.
      - name: Draft release
        run: |
          VER="${{ steps.labels.outputs.version }}"
          gh release create "v${VER}" \
            --repo isdneuroimaging/delta-svd \
            --draft \
            --verify-tag \
            --title "DELTA-SVD ${VER}" \
            --notes "Image: \`ghcr.io/isdneuroimaging/delta-svd@${{ github.event.inputs.digest }}\`"

      - name: Job summary
        run: |
          {
            echo "### Promoted"
            echo "\`ghcr.io/isdneuroimaging/delta-svd:${{ steps.labels.outputs.version }}\` @ \`${{ github.event.inputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
