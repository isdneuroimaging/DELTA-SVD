name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR; unlike the docs workflow's Pages
# deploy, there is nothing here that would be wrong to cancel mid-flight.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # Use the same Python packages and shared libraries as the container,
    # installed from explicit URLs without solving the environment.
    runs-on: ubuntu-latest
    # Environment creation downloads the pinned packages from their channels.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: tests/run-in-locked-env.sh

  compileall:
    # Tripwire for syntax that a non-3.11 dev interpreter accepts but the
    # container's Python 3.11 does not (e.g. PEP 701 f-string syntax added in
    # 3.12). ast.parse(..., feature_version=(3, 11)) does NOT catch this - the
    # tokenizer runs before the feature-version check - so this needs a real
    # 3.11 interpreter compiling every module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m compileall -q container/scripts tools tests

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: container/Dockerfile
          failure-threshold: warning
