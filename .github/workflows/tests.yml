name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR; unlike the docs workflow's Pages
# deploy, there is nothing here that would be wrong to cancel mid-flight.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # Use the same Python packages and shared libraries as the container,
    # installed from explicit URLs without solving the environment.
    runs-on: ubuntu-24.04
    # Environment creation downloads the pinned packages from their channels.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # TEMPORARY: diagnose container DNS failure; remove before merge.
      - name: Diagnose Ubuntu archive DNS
        continue-on-error: true
        run: |
          grep -rh '^URIs:\|^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u || true
          for name in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com ports.ubuntu.com registry-1.docker.io; do
            for srv in 168.63.129.16 1.1.1.1 8.8.8.8; do
              echo "== $name @ $srv: $(dig +short +time=3 +tries=1 "$name" @"$srv" | tr '\n' ' ') status=$(dig +time=3 +tries=1 "$name" @"$srv" | grep -o 'status: [A-Z]*')"
            done
          done
          dig +time=3 +tries=1 archive.ubuntu.com @168.63.129.16 || true
      - run: tests/run-in-locked-env.sh

  compileall:
    # Tripwire for syntax that a non-3.11 dev interpreter accepts but the
    # container's Python 3.11 does not (e.g. PEP 701 f-string syntax added in
    # 3.12). ast.parse(..., feature_version=(3, 11)) does NOT catch this - the
    # tokenizer runs before the feature-version check - so this needs a real
    # 3.11 interpreter compiling every module.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m compileall -q container/scripts tools tests

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: container/Dockerfile
          failure-threshold: warning
