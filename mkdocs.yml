site_name: DELTA-SVD
site_description: >-
  Diffusion Endpoints for Longitudinal Tracking of white matter Alterations
  in cerebral Small Vessel Disease
site_url: https://delta-svd.com
repo_url: https://github.com/isdneuroimaging/DELTA-SVD
repo_name: isdneuroimaging/DELTA-SVD
docs_dir: docs

theme:
  name: material
  # Adds the Open Graph / Twitter card tags for link previews; see
  # overrides/main.html. Everything else comes from the stock theme.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    # Follows the OS setting until the reader picks a preference (cycles
    # system -> light -> dark -> system).
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: install.md
  - Data requirements: requirements.md
  - Usage: usage.md
  - Advanced usage: advanced-usage.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  # GitHub-style alerts ( > [!NOTE] ) -> Material admonitions, at build time
  - github-callouts
  - admonition
  - pymdownx.details
  # Code blocks, inline code highlighting, tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
