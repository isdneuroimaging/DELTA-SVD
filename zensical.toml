[project]
site_name = "DELTA-SVD"
site_description = "Diffusion Endpoints for Longitudinal Tracking of white matter Alterations in cerebral Small Vessel Disease"
site_url = "https://delta-svd.com"
repo_url = "https://github.com/isdneuroimaging/DELTA-SVD"
repo_name = "isdneuroimaging/DELTA-SVD"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Overview" = "overview.md" },
  { "Installation" = "install.md" },
  { "Data requirements" = "requirements.md" },
  { "Usage" = "usage.md" },
  { "Advanced usage" = "advanced-usage.md" },
  { "FAQ" = "faq.md" },
]

extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
# Adds the Open Graph / Twitter card tags for link previews; see
# overrides/main.html. Everything else comes from the stock theme.
custom_dir = "overrides"
favicon = "assets/favicon.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "toc.follow",
]

[project.theme.icon]
logo = "material/delta"

# Follows the OS setting until the reader picks a preference (cycles
# system -> light -> dark -> system). Icons reflect the mode currently
# active, not the mode a click switches to.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
# GitHub-style alerts ( > [!NOTE] ) -> Material admonitions, at build time
github-callouts = {}
admonition = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.snippets = {}
tables = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
